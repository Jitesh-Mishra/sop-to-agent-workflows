<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-label="SOP text is compiled by an LLM into a typed workflow spec, checked by a hand-written validator with a repair loop, scored against gold labels, and executed by a LangGraph runtime with SQLite checkpoints, exposed through MCP, REST and a CLI."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect width="1080" height="640" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">SOP in, validated agent workflow out</text><text x="32" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Compile, validate and repair, then run with checkpoints. Every claim is scored against gold labels.</text><rect x="28" y="110" width="190" height="96" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="123.0" y="154.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="middle">38 SOPs</text><text x="123.0" y="173.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">18 in 5 Oracle-mapped families</text><text x="123.0" y="189.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">20 out-of-domain</text><rect x="28" y="236" width="190" height="78" rx="10" fill="#dcf4ea" stroke="#1baf7a" stroke-width="1.5"/><text x="123.0" y="271.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#1f2328" text-anchor="middle">gold labels</text><text x="123.0" y="290.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">steps, edges, handoffs,</text><text x="123.0" y="306.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">agent vs human</text><rect x="248" y="92" width="520" height="250" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="264" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#59636e" text-anchor="start">COMPILE</text><rect x="268" y="132" width="150" height="92" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/><text x="343.0" y="174.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#1f2328" text-anchor="middle">compiler.py</text><text x="343.0" y="193.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Qwen2.5 GGUF (CI)</text><text x="343.0" y="209.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">JSON-schema output</text><rect x="440" y="132" width="150" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="515.0" y="174.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#1f2328" text-anchor="middle">validator.py</text><text x="515.0" y="193.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">cycles, dangling edges,</text><text x="515.0" y="209.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">bad lines, no owner</text><rect x="612" y="132" width="140" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="682.0" y="174.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="middle">WorkflowSpec</text><text x="682.0" y="193.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">steps, edges,</text><text x="682.0" y="209.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">handoffs, executor</text><line x1="218" y1="158" x2="264" y2="170" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="418" y1="178" x2="436" y2="178" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="590" y1="178" x2="608" y2="178" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><path d="M515,224 C515,262 343,262 343,228" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arb)"/><text x="429" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, 