name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (graph algorithms, validator, scorer, repair loop, runtime crash/resume, MCP client, REST)
        run: pytest -q
      - name: Crash/resume harness on all 38 workflows
        run: python -m sopflow.eval.crash_resume
      - name: Docker image builds and serves
        run: |
          docker build -t sopflow .
          docker run -d -p 8000:8000 --name s sopflow
          for i in $(seq 1 30); do curl -sf localhost:8000/workflows > /dev/null && break; sleep 1; done
          curl -sf -X POST localhost:8000/runs -H 'content-type: application/json' -d '{"sop_id":"onb_form_i9_verification"}' | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='waiting_for_human', d; print(d['run_id'], d['pending_handoff']['step_id'])"
